# Receta MPM: Firefox (binario oficial de Mozilla, bundlea sus propias libs)
NAME="firefox"
VERSION="154.0.1"
SOURCE_URL="https://download-installer.cdn.mozilla.net/pub/firefox/releases/154.0.1/linux-x86_64/en-US/firefox-154.0.1.tar.xz"
SOURCE_SHA256="ca29d2d001e0e54e3d83716d1104adb1ed281200d5fea6fdf8fac21b3ce3e526"
BUILD_CMD=""
INSTALL_CMD='mkdir -p "$DESTDIR$PREFIX/lib/firefox" "$DESTDIR$PREFIX/bin" "$DESTDIR/usr/share/applications" && cp -a . "$DESTDIR$PREFIX/lib/firefox/" && ln -sf ../lib/firefox/firefox "$DESTDIR$PREFIX/bin/firefox" && printf "[Desktop Entry]\nType=Application\nName=Firefox\nExec=/usr/bin/firefox %%u\nIcon=firefox\nTerminal=false\nCategories=Network;WebBrowser;\n" > "$DESTDIR/usr/share/applications/firefox.desktop"'
DEPENDS=""
