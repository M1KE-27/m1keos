# Receta MPM: Node.js (binario oficial precompilado, glibc)
# Uso: mpm build-recipe /usr/share/mikeos/recipes/nodejs && mpm update && mpm install nodejs
NAME="nodejs"
VERSION="22.14.0"
SOURCE_URL="https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz"
SOURCE_SHA256="69b09dba5c8dcb05c4e4273a4340db1005abeafe3927efda2bc5b249e80437ec"
BUILD_CMD=""
INSTALL_CMD='mkdir -p "$DESTDIR$PREFIX" && for d in bin lib include share; do [ -d "$d" ] && cp -a "$d" "$DESTDIR$PREFIX/"; done'
DEPENDS=""
