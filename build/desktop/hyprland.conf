# ==============================================================================
# MIKE DESKTOP — Hyprland Configuration (v0.2.0)
# Minimalist, Ultra-fast, Clean and Fully Customizable
# ==============================================================================

# Monitor adaptativo: "preferred" funciona en paneles antiguos, QEMU, VGA
# estándar y pantallas modernas sin forzar una resolución inexistente.
#
# Aquí ponía 1920x1080@75, justo debajo de este comentario que dice lo
# contrario. En una Surface Laptop 4 el panel es 2256x1504 y la proporción es
# 3:2, así que forzar 16:9 es pedirle al compositor un modo que no existe.
# La escala se queda en 1 AQUÍ y la decide m-hw-profile, que escribe el
# fragmento de más abajo. "auto" se probó y no vale: Hyprland la deduce del
# tamaño físico que declara el panel, y un monitor virtual declara cualquier
# cosa -- en QEMU eligió 2x y dejó el escritorio con todo al doble.
monitor=,preferred,auto,1
# Absolute path avoids tilde/glob expansion failures in Hyprland 0.56+.
# m-hw-profile refreshes this machine-wide fragment before launch.
source = /etc/mikeos/desktop/hyprland.local.conf

# Autostart essential visual components. Sin m-terminal aquí: el
# escritorio arranca limpio (solo wallpaper + barra); la terminal se abre
# a demanda con SUPER+Return. m-welcome solo se muestra la primera vez
# (ver ~/.config/mike/.welcomed) y explica los controles del sistema.
# Servidor de audio. PipeWire va por usuario, no como servicio del sistema:
# necesita XDG_RUNTIME_DIR y la sesión gráfica, así que arranca aquí y no en
# runit. pipewire-pulse da compatibilidad con las aplicaciones que hablan
# PulseAudio.
# m-audio-setup declara la tarjeta antes de arrancar PipeWire: WirePlumber
# descubre las tarjetas por udev y el sustituto que usa MIKE OS no le da esa
# información, así que sin esto el sistema detecta la tarjeta pero no expone
# ninguna salida de audio.
# Tema oscuro para las aplicaciones GTK y Qt. Sin esto, cada ventana GTK
# salía con el Adwaita claro de fábrica mientras el resto del escritorio era
# oscuro -- el selector de fondos en blanco es el ejemplo más visible.
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORMTHEME,gtk3
env = XCURSOR_SIZE,24
# El tema del cursor, para TODO: Wayland, GTK, Qt y XWayland.
#
# No había ninguna línea como ésta, y encima start-mike-desktop exportaba
# XCURSOR_THEME="" (vacío). El resultado: cada aplicación elegía cursor por su
# cuenta y ninguna encontraba un tema, porque la imagen tampoco traía ninguno.
env = XCURSOR_THEME,MikeOS-Cursor
env = HYPRCURSOR_THEME,MikeOS-Cursor
env = HYPRCURSOR_SIZE,24

# ------------------------------------------------------------------------------
# Aplicaciones que se rompen en Wayland, y qué se les dice a cada una
#
# Wayland es el presente, pero medio catálogo de Linux sigue asumiendo X11 o
# tiene el soporte de Wayland a medias. Cuando eso pasa, el fallo NUNCA se
# parece a su causa: la aplicación se cierra sin decir nada, o sale en negro,
# o el texto se ve borroso. Estas variables le dicen a cada familia por dónde
# ir, y son la diferencia entre "funciona" y "se cierra sola".
# ------------------------------------------------------------------------------

# Java (Minecraft, y cualquier cosa con Swing o AWT).
#
# Java NO habla Wayland: va por XWayland siempre. Y sin esto las ventanas
# salen con el título en blanco y sin poder moverlas, porque AWT da por hecho
# que el gestor de ventanas reparenta las ventanas, y ningún compositor
# Wayland lo hace.
env = _JAVA_AWT_WM_NONREPARENTING,1
env = AWT_TOOLKIT,MToolkit

# SDL (juegos, emuladores). Se intenta Wayland y, si la versión de SDL es
# vieja y no lo tiene, cae a X11 sola en vez de morir.
env = SDL_VIDEODRIVER,wayland,x11

# Firefox y derivados: Wayland nativo, que es donde se ven bien las fuentes.
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_WEBRENDER,1

# Qt. "wayland;xcb" es una lista de preferencia: si una aplicación Qt no sabe
# de Wayland, usa XWayland en lugar de cerrarse.
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GTK: Wayland primero, X11 de respaldo. Mismo motivo.
env = GDK_BACKEND,wayland,x11

# Electron / Chromium. Sin estas banderas arrancan en XWayland con el texto
# borroso en pantallas con escalado, y muchos ni arrancan.
env = NIXOS_OZONE_WL,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Clutter y las aplicaciones de GNOME antiguas.
env = CLUTTER_BACKEND,wayland

# XDG: hay programas que deciden cómo dibujarse leyendo esto.
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Táctil: arrastrar con un dedo desplaza, y tres dedos cambian de espacio de
# trabajo. Hyprland lo gestiona por libinput, así que vale igual para un
# panel táctil de portátil que para una tableta.
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
}

exec-once = /usr/bin/m-audio-setup
exec-once = sleep 1 && /usr/bin/pipewire
exec-once = sleep 2 && /usr/bin/wireplumber
exec-once = sleep 3 && /usr/bin/pipewire-pulse

# El fondo lo pone m-fondo, no una ruta fija: aquí estaba escrito
# /usr/share/backgrounds/wallpaper.png, así que cada sesión nueva borraba el
# fondo que hubieras elegido. Y va como servicio porque swaybg no lo vigilaba
# nadie: si se caía, el escritorio se quedaba en negro hasta reiniciar.
exec-once = /usr/bin/m-fondo servicio
exec-once = /usr/bin/m-panel
exec-once = sleep 1 && hyprctl dismissnotify -1 || true
exec-once = sleep 1 && /usr/bin/m-welcome

# Si se arrancó desde la entrada "Instalar MIKE OS" del menú, se abre el
# instalador solo. m-arranque-instalar mira la línea de órdenes del kernel y no
# hace nada si no viene esa marca, así que en un arranque normal no estorba.
#
# Existe porque la única forma de llegar al instalador era arrancar "probar sin
# instalar", esperar, y encontrar el botón dentro de la ventana de bienvenida.
# Quien viene a instalar mira el menú de arranque, y si ahí no pone "instalar"
# da por hecho que no se puede.
exec-once = /usr/bin/m-arranque-instalar

# Cursor configuration (software mouse integration)
cursor {
    no_hardware_cursors = true
    enable_hyprcursor = false
    sync_gsettings_theme = false
    no_warps = false
}

# Input devices
input {
    # "us" primero: el teclado virtual de QEMU (usb-tablet + ps2) siempre
    # envía scancodes asumiendo layout US: con "es" primero, cada tecla se
    # interpreta desplazada (l -> ñ, etc). "es" queda como alternativa vía
    # Alt+Shift para quien necesite ñ/acentos.
    kb_layout = us,es
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        # Todo lo de abajo faltaba, y ésa es media explicación de "los botones
        # no reaccionan". El bloque sólo traía natural_scroll, así que en un
        # portátil el touchpad se quedaba con lo que trajera Hyprland de
        # fábrica. En QEMU da igual (el puntero es un tablet con botones de
        # verdad); delante de un clickpad, no.
        tap-to-click = true
        tap-and-drag = true
        drag_lock = true
        # Dos dedos = botón derecho, tres = botón central. Es lo que espera
        # cualquiera que venga de otro sistema.
        clickfinger_behavior = true
        # Desactivar el touchpad mientras escribes viene activado de fábrica y
        # es justo lo contrario de lo que quiere alguien rellenando un
        # formulario: escribes, vas a pulsar el botón de al lado y el touchpad
        # está muerto medio segundo.
        disable_while_typing = false
        scroll_factor = 1.0
    }
    sensitivity = 0
}

# General Window Appearance
general {
    # Menos aire. Con 6 dentro y 12 fuera, en una pantalla de portátil se
    # perdían casi cuarenta píxeles por cada lado entre ventanas.
    gaps_in = 4
    gaps_out = 6
    border_size = 2

    # Redimensionar arrastrando el BORDE de la ventana.
    #
    # Esto no estaba, y su valor por defecto es "false": arrastrar un borde no
    # hacía absolutamente nada, y la única forma de cambiar el tamaño era
    # SUPER + botón derecho, que hay que saberse. De ahí "no es fácil
    # redimensionar desde los bordes o las esquinas".
    resize_on_border = true
    # El borde son 2 píxeles; sin agrandar la zona sensible habría que acertar
    # en dos píxeles con el dedo.
    extend_border_grab_area = 14
    hover_icon_on_border = true
    col.active_border = rgba(00d4ffee) rgba(0088ffee) 45deg
    col.inactive_border = rgba(252530aa)
    layout = dwindle
    allow_tearing = false
}

# Visual Decorations. blur/shadow reales los decide el fragmento de
# ajustes de usuario (ver más abajo); aquí solo el rounding base.
decoration {
    rounding = 8
    shadow {
        enabled = false
    }
}

# blur, opacidad, velocidad de animación, nº workspaces, posición de
# barra, color de acento y layout de teclado: todo editable en vivo desde
# m-settings. Este archivo lo genera m-apply-settings (o start-mike-desktop
# con los valores por defecto si el usuario nunca abrió los ajustes) --
# DEBE existir antes de este punto o Hyprland falla al arrancar.
source = /home/mike/.config/mike/user-settings.hypr.conf

# Layout configuration
dwindle {
    preserve_split = true
    # Partir SIEMPRE por el lado largo, en vez de por donde esté el cursor.
    #
    # Sin esto, la tercera ventana y las siguientes se colocan donde caiga el
    # ratón en ese instante, y el resultado cambia cada vez. Es lo que hacía
    # que "con más de dos o tres ventanas se redimensionan mal": no era el
    # tamaño, era que la división era impredecible.
    force_split = 0
    smart_split = false
    smart_resizing = true
    default_split_ratio = 1.0
}

# Clean, zero-nag settings + performance
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x0a0c12
    vrr = 0
    # Sin actividad en pantalla, no se repinta: baja el consumo de CPU casi a
    # cero en reposo. Es lo que más se nota en portátiles y en máquinas sin
    # aceleración por hardware.
    vfr = true
}

# X11. MIKE OS es Wayland puro, pero medio catálogo de Linux sigue siendo
# X11: juegos, aplicaciones Java (Minecraft entre ellas), Wine, Electron en
# modo X11, GTK2 y Qt4. Sin Xwayland, GLFW muere con "The DISPLAY environment
# variable is missing" y no hay forma de ejecutarlas.
#
# force_zero_scaling evita que las ventanas X11 salgan borrosas en pantallas
# con escalado, que es como se ven por defecto.
xwayland {
    enabled = true
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

debug {
    suppress_errors = true
}

# MTerminal es una superficie limpia: sin borde cyan ni esquinas añadidas por
# Hyprland. Las pestañas solo aparecen cuando existen varias.
windowrule = match:class ^(org.mikeos.MTerminal)$, border_size 0
windowrule = match:class ^(org.mikeos.MTerminal)$, rounding 0

# m-welcome es un diálogo GTK sin decorar: sin estas reglas, dwindle lo tilea
# a pantalla completa y GTK sólo pinta su tamaño natural, dejando el resto
# vacío.
#
# Este archivo tenía DOS juegos de reglas para esta misma ventana. Arriba, tres
# líneas con "windowrulev2" pidiendo 880x580 centrada; aquí abajo, otras
# pidiendo "94% 92%". Las de arriba no hacían nada: Hyprland 0.56 eliminó
# windowrulev2 y ahora todo es "windowrule" con "match:". Así que mandaba el
# 94% 92% --- 1805x994 en una pantalla de 1080p --- y la pantalla de bienvenida
# llevaba meses saliendo estirada de lado a lado, con el contenido arriba y un
# vacío enorme debajo. Es la primera pantalla del sistema y la foto de portada
# de la web.
#
# Y no había forma de verlo leyendo un archivo: m-welcome.c tenía el arreglo
# puesto y explicado ("una ventana estirada a pantalla completa se ve
# abandonada"), y el compositor lo deshacía desde otro archivo. De ahí que
# ahora haya un solo juego de reglas y en un solo sitio.
#
# Y sin regla de TAMAÑO, a propósito. El tamaño lo decide el programa, que es
# el único que sabe las dos cosas que hacen falta: cuánto mide su contenido y
# cuánto mide la pantalla (ver el cálculo en m-welcome.c, que descuenta
# también el alto de esta barra). Cada vez que este archivo ha intentado
# opinar sobre el tamaño de esa ventana ha sido para estropearlo: primero con
# un 94% que la estiraba de lado a lado, y luego con una cifra fija que en una
# pantalla de 800 px de alto no cabía junto a la barra.
#
# Y "float true", no "float". Hyprland 0.56 exige un valor en las reglas
# booleanas: "float" a secas se rechaza con "invalid field float: missing a
# value" --- por el registro del compositor, que nadie lee, y no por la
# pantalla. Así que esta ventana nunca llegó a flotar ni a centrarse por
# ninguno de los dos juegos de reglas que tenía. La regla de "blur" se ha
# quitado entera: en esta versión no existe como regla de ventana ("invalid
# field type blur"), y una línea que el compositor rechaza no es una función,
# es ruido que parece una función.
windowrule = match:class ^(m-welcome)$, float true
windowrule = match:class ^(m-welcome)$, center true

# ==============================================================================
# KEYBINDINGS (Supports Super, Alt, and Ctrl+Alt to avoid Host conflicts!)
# ==============================================================================
$mainMod = SUPER
$altMod = ALT

# Applications & Terminal
bind = $mainMod, Return, exec, /usr/bin/m-terminal
bind = $altMod, Return, exec, /usr/bin/m-terminal
bind = CTRL ALT, T, exec, /usr/bin/m-terminal
bind = CTRL ALT, Return, exec, /usr/bin/m-terminal
# Accesos solicitados por MIKE OS.
bind = CTRL ALT, S, exec, /usr/bin/m-screenshot
bind = ALT SUPER, S, exec, /usr/bin/m-screenshot
bind = CTRL ALT, up, exec, /usr/bin/m-volume 5
bind = CTRL ALT, down, exec, /usr/bin/m-volume -5
bind = ALT SUPER, up, exec, /usr/bin/m-volume 5
bind = ALT SUPER, down, exec, /usr/bin/m-volume -5

# Application Launcher
bind = $mainMod, Space, exec, /usr/bin/fuzzel
bind = $altMod, Space, exec, /usr/bin/fuzzel
bind = CTRL ALT, Space, exec, /usr/bin/fuzzel

# Window Control
bind = $mainMod, Q, killactive,
bind = $altMod, Q, killactive,
bind = $altMod, F4, killactive,
# Salir de la sesión ya NO está en SUPER+M ni en ALT+M.
#
# "exit" cierra Hyprland entero: todas las ventanas, todo el trabajo sin
# guardar, sin preguntar. Y estaba una tecla al lado de SUPER+Q, que cierra una
# sola ventana. ALT+M además es una combinación que usan las propias
# aplicaciones. Alguien que quería cerrar una ventana se quedaba sin sesión.
#
# Queda sólo en SUPER+F12, que no se pulsa por accidente, y pasa por
# m-salir-sesion, que pregunta antes.
bind = $mainMod, V, togglefloating,
bind = $altMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $altMod, F, fullscreen, 0

# ==============================================================================
# CERRAR LA TAPA
# ==============================================================================
# No se gestionaba. En una máquina virtual no hay tapa; en un portátil, cerrarla
# y que la pantalla siga encendida significa que el equipo se queda gastando
# batería dentro de la mochila hasta que se apaga solo. Y un apagado de golpe
# con la raíz en btrfs puede dejar el sistema de archivos a medias.
#
# Qué hace: apaga la pantalla y bloquea la sesión. NO suspende, y es a
# propósito: suspender y despertar bien necesita firmware y ajustes de energía
# que este sistema todavía no tiene probados, y un equipo que suspende pero no
# despierta es peor que uno que no suspende. Por eso no se decide aquí: m-tapa
# lee lo que haya elegido quien usa el equipo en el Centro de Control
# («Energía» → «Al cerrar la tapa»), y ahí sólo se ofrece suspender si este
# equipo lo publica de verdad en /sys/power/state.
#
# El nombre del dispositivo de la tapa varía según el equipo, así que se cogen
# todos los que lo parezcan en vez de escribir uno a mano.
bindl = , switch:on:Lid Switch,  exec, /usr/bin/m-tapa cerrar
bindl = , switch:off:Lid Switch, exec, /usr/bin/m-tapa abrir

# ==============================================================================
# TECLAS DE FUNCIÓN DEL PORTÁTIL
# ==============================================================================
# No existían. En una máquina virtual no se echan de menos porque no hay teclas
# de brillo ni de volumen, pero en un portátil son de lo primero que alguien
# pulsa, y no hacían absolutamente nada.
#
# bindel en vez de bind: la "e" es "repeat", o sea que dejar la tecla pulsada
# sigue subiendo en vez de moverse un paso por pulsación. La "l" es "locked":
# funcionan también con la pantalla bloqueada, que es lo que se espera del
# volumen y del brillo.
# Los argumentos son los que m-volume entiende de verdad: 5 y -5, no "up" y
# "down". Comprobado leyendo la herramienta en vez de suponerlo.
bindel = , XF86AudioRaiseVolume,  exec, /usr/bin/m-volume 5
bindel = , XF86AudioLowerVolume,  exec, /usr/bin/m-volume -5
bindl  = , XF86AudioMute,         exec, /usr/bin/m-volume mute
bindel = , XF86MonBrightnessUp,   exec, /usr/bin/m-brillo subir
bindel = , XF86MonBrightnessDown, exec, /usr/bin/m-brillo bajar

# La tecla de bloqueo, en los teclados que la traen.
bindl  = , XF86ScreenSaver, exec, /usr/bin/m-bloquear

# La tecla de suspender, en los teclados que la traen. Bloquea antes de dormir
# --- igual que la tapa --- porque despertar sin contraseña es exactamente lo
# contrario de lo que se espera al cerrar un portátil.
# El sh -c es necesario: hay que bloquear, esperar a que la ventana de bloqueo
# esté pintada, y sólo entonces dormir. Al revés se duerme con la pantalla sin
# bloquear y se despierta con la sesión abierta.
bindl  = , XF86Sleep, exec, sh -c '/usr/bin/m-bloquear & sleep 1; /usr/bin/m-energia suspender'

# La tecla de avión NO se ata aquí a propósito. Lo evidente sería apagar el
# Bluetooth con ella, pero entonces sólo apaga: volver a encenderlo hay que
# buscarlo en el panel, y quien la pulsa sin querer se queda sin Bluetooth sin
# saber por qué. Un interruptor de un solo sentido es peor que ninguno.

# Captura de pantalla con la tecla de siempre.
bind = , Print, exec, /usr/bin/m-screenshot

# Bloquear la sesión. SUPER+L es el atajo que ya tiene todo el mundo en los
# dedos, venga de donde venga. El ALT+L de repuesto existe por lo mismo que el
# resto de duplicados de este archivo: en una máquina virtual el anfitrión se
# queda con SUPER y el atajo nunca llega.
bind = $mainMod, L, exec, /usr/bin/m-bloquear
bind = $altMod, L, exec, /usr/bin/m-bloquear

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $altMod, left, movefocus, l
bind = $altMod, right, movefocus, r
bind = $altMod, up, movefocus, u
bind = $altMod, down, movefocus, d


# Navegación circular entre los cuatro workspaces del rice.
bind = $mainMod, mouse_down, exec, /usr/bin/m-workspace-cycle next
bind = $mainMod, mouse_up, exec, /usr/bin/m-workspace-cycle prev


# Mouse Move/Resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $altMod, mouse:272, movewindow
bindm = $altMod, mouse:273, resizewindow

# MIKE OS rice: workspaces persistentes y accesos rápidos propios.
bind = $mainMod, D, exec, /usr/bin/m-launcher
bind = $mainMod, N, exec, /usr/bin/m-network status
bind = $mainMod, I, exec, /usr/bin/m-system
# El selector de fondos vive dentro de la shell, no en una ventana GTK
# aparte. Hyprland no puede llamar a un objeto QML, así que se lo pide por
# la interfaz de mensajes de Quickshell.
# Con --path, no a secas: "quickshell ipc call" busca una configuración
# llamada "default" en <XDG_CONFIG_HOME>/quickshell/shell.qml, y la sesión no
# exporta XDG_CONFIG_HOME. Sin esto, SUPER+W no hacía nada de nada: el error
# se lo quedaba un proceso lanzado en segundo plano por el compositor.
bind = $mainMod, W, exec, /usr/bin/quickshell ipc --path $HOME/.config/mike/quickshell/shell.qml call fondos abrir
bind = $mainMod, F1, exec, /usr/bin/m-doctor
bind = $mainMod, F2, exec, /usr/bin/m-service list
bind = $mainMod, F12, exec, /usr/bin/m-salir-sesion

# El compositor usa sus reglas modernas por defecto; evitar la sintaxis
# windowrulev2 retirada en Hyprland 0.56.
