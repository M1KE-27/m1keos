# ==============================================================================
# MIKE DESKTOP — Hyprland Configuration (v0.2.0)
# Minimalist, Ultra-fast, Clean and Fully Customizable
# ==============================================================================

# Monitor adaptativo: "preferred" funciona en paneles antiguos, QEMU, VGA
# estándar y pantallas modernas sin forzar una resolución inexistente.
monitor=,1920x1080@75,auto,1
# Absolute path avoids tilde/glob expansion failures in Hyprland 0.56+.
# m-hw-profile refreshes this machine-wide fragment before launch.
source = /etc/mikeos/desktop/hyprland.local.conf

# Autostart essential visual components. Sin m-terminal aquí: el
# escritorio arranca limpio (solo wallpaper + barra); la terminal se abre
# a demanda con SUPER+Return. m-welcome solo se muestra la primera vez
# (ver ~/.config/mike/.welcomed) y explica los controles del sistema.
# Servidor de audio. PipeWire va por usuario, no como servicio del sistema:
# necesita XDG_RUNTIME_DIR y la sesión gráfica, así que arranca aquí y no en
# runit. pipewire-pulse da compatibilidad con las aplicaciones que hablan
# PulseAudio.
# m-audio-setup declara la tarjeta antes de arrancar PipeWire: WirePlumber
# descubre las tarjetas por udev y el sustituto que usa MIKE OS no le da esa
# información, así que sin esto el sistema detecta la tarjeta pero no expone
# ninguna salida de audio.
# Tema oscuro para las aplicaciones GTK y Qt. Sin esto, cada ventana GTK
# salía con el Adwaita claro de fábrica mientras el resto del escritorio era
# oscuro -- el selector de fondos en blanco es el ejemplo más visible.
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORMTHEME,gtk3
env = XCURSOR_SIZE,24

# Táctil: arrastrar con un dedo desplaza, y tres dedos cambian de espacio de
# trabajo. Hyprland lo gestiona por libinput, así que vale igual para un
# panel táctil de portátil que para una tableta.
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
}

exec-once = /usr/bin/m-audio-setup
exec-once = sleep 1 && /usr/bin/pipewire
exec-once = sleep 2 && /usr/bin/wireplumber
exec-once = sleep 3 && /usr/bin/pipewire-pulse

# El fondo lo pone m-fondo, no una ruta fija: aquí estaba escrito
# /usr/share/backgrounds/wallpaper.png, así que cada sesión nueva borraba el
# fondo que hubieras elegido. Y va como servicio porque swaybg no lo vigilaba
# nadie: si se caía, el escritorio se quedaba en negro hasta reiniciar.
# La pantalla de bienvenida pide 880x580, pero una ventana en mosaico no
# elige su tamaño: lo decide el compositor. Por eso salía ocupando la pantalla
# entera, con el contenido flotando en un vacío enorme. Flotante y centrada.
windowrulev2 = float,  class:^(m-welcome)$
windowrulev2 = size 880 580, class:^(m-welcome)$
windowrulev2 = center, class:^(m-welcome)$

exec-once = /usr/bin/m-fondo servicio
exec-once = /usr/bin/m-panel
exec-once = sleep 1 && hyprctl dismissnotify -1 || true
exec-once = sleep 1 && /usr/bin/m-welcome

# Cursor configuration (software mouse integration)
cursor {
    no_hardware_cursors = true
    enable_hyprcursor = false
    sync_gsettings_theme = false
    no_warps = false
}

# Input devices
input {
    # "us" primero: el teclado virtual de QEMU (usb-tablet + ps2) siempre
    # envía scancodes asumiendo layout US: con "es" primero, cada tecla se
    # interpreta desplazada (l -> ñ, etc). "es" queda como alternativa vía
    # Alt+Shift para quien necesite ñ/acentos.
    kb_layout = us,es
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# General Window Appearance
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(00d4ffee) rgba(0088ffee) 45deg
    col.inactive_border = rgba(252530aa)
    layout = dwindle
    allow_tearing = false
}

# Visual Decorations. blur/shadow reales los decide el fragmento de
# ajustes de usuario (ver más abajo); aquí solo el rounding base.
decoration {
    rounding = 8
    shadow {
        enabled = false
    }
}

# blur, opacidad, velocidad de animación, nº workspaces, posición de
# barra, color de acento y layout de teclado: todo editable en vivo desde
# m-settings. Este archivo lo genera m-apply-settings (o start-mike-desktop
# con los valores por defecto si el usuario nunca abrió los ajustes) --
# DEBE existir antes de este punto o Hyprland falla al arrancar.
source = /home/mike/.config/mike/user-settings.hypr.conf

# Layout configuration
dwindle {
    preserve_split = true
}

# Clean, zero-nag settings + performance
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x0a0c12
    vrr = 0
    # Sin actividad en pantalla, no se repinta: baja el consumo de CPU casi a
    # cero en reposo. Es lo que más se nota en portátiles y en máquinas sin
    # aceleración por hardware.
    vfr = true
}

# X11. MIKE OS es Wayland puro, pero medio catálogo de Linux sigue siendo
# X11: juegos, aplicaciones Java (Minecraft entre ellas), Wine, Electron en
# modo X11, GTK2 y Qt4. Sin Xwayland, GLFW muere con "The DISPLAY environment
# variable is missing" y no hay forma de ejecutarlas.
#
# force_zero_scaling evita que las ventanas X11 salgan borrosas en pantallas
# con escalado, que es como se ven por defecto.
xwayland {
    enabled = true
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

debug {
    suppress_errors = true
}

# MTerminal es una superficie limpia: sin borde cyan ni esquinas añadidas por
# Hyprland. Las pestañas solo aparecen cuando existen varias.
windowrule = match:class ^(org.mikeos.MTerminal)$, border_size 0
windowrule = match:class ^(org.mikeos.MTerminal)$, rounding 0

# m-welcome es un diálogo GTK sin decorar: sin esta regla dwindle lo
# tilea a pantalla completa y GTK solo pinta su tamaño natural en la
# esquina, dejando el resto en negro. Ocupa casi toda la pantalla; el
# margen que sobra alrededor se ve con el wallpaper desenfocado (layerrule
# de abajo) y el propio panel usa fondo semitransparente + blur para un
# efecto "cristal esmerilado".
windowrule = match:class ^(m-welcome)$, float
windowrule = match:class ^(m-welcome)$, center
# Porcentaje, no píxeles: con un tamaño fijo el panel se salía de las
# pantallas pequeñas y el botón de cerrar quedaba fuera.
windowrule = match:class ^(m-welcome)$, size 94% 92%
windowrule = match:class ^(m-welcome)$, blur

# ==============================================================================
# KEYBINDINGS (Supports Super, Alt, and Ctrl+Alt to avoid Host conflicts!)
# ==============================================================================
$mainMod = SUPER
$altMod = ALT

# Applications & Terminal
bind = $mainMod, Return, exec, /usr/bin/m-terminal
bind = $altMod, Return, exec, /usr/bin/m-terminal
bind = CTRL ALT, T, exec, /usr/bin/m-terminal
bind = CTRL ALT, Return, exec, /usr/bin/m-terminal
# Accesos solicitados por MIKE OS.
bind = CTRL ALT, S, exec, /usr/bin/m-screenshot
bind = ALT SUPER, S, exec, /usr/bin/m-screenshot
bind = CTRL ALT, up, exec, /usr/bin/m-volume 5
bind = CTRL ALT, down, exec, /usr/bin/m-volume -5
bind = ALT SUPER, up, exec, /usr/bin/m-volume 5
bind = ALT SUPER, down, exec, /usr/bin/m-volume -5

# Application Launcher
bind = $mainMod, Space, exec, /usr/bin/fuzzel
bind = $altMod, Space, exec, /usr/bin/fuzzel
bind = CTRL ALT, Space, exec, /usr/bin/fuzzel

# Window Control
bind = $mainMod, Q, killactive,
bind = $altMod, Q, killactive,
bind = $altMod, F4, killactive,
bind = $mainMod, M, exit,
bind = $altMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $altMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $altMod, F, fullscreen, 0

# ==============================================================================
# CERRAR LA TAPA
# ==============================================================================
# No se gestionaba. En una máquina virtual no hay tapa; en un portátil, cerrarla
# y que la pantalla siga encendida significa que el equipo se queda gastando
# batería dentro de la mochila hasta que se apaga solo. Y un apagado de golpe
# con la raíz en btrfs puede dejar el sistema de archivos a medias.
#
# Qué hace: apaga la pantalla y bloquea la sesión. NO suspende, y es a
# propósito: suspender y despertar bien necesita firmware y ajustes de energía
# que este sistema todavía no tiene probados, y un equipo que suspende pero no
# despierta es peor que uno que no suspende. Cuando eso esté probado, aquí es
# donde se cambia.
#
# El nombre del dispositivo de la tapa varía según el equipo, así que se cogen
# todos los que lo parezcan en vez de escribir uno a mano.
bindl = , switch:on:Lid Switch,  exec, /usr/bin/m-tapa cerrar
bindl = , switch:off:Lid Switch, exec, /usr/bin/m-tapa abrir

# ==============================================================================
# TECLAS DE FUNCIÓN DEL PORTÁTIL
# ==============================================================================
# No existían. En una máquina virtual no se echan de menos porque no hay teclas
# de brillo ni de volumen, pero en un portátil son de lo primero que alguien
# pulsa, y no hacían absolutamente nada.
#
# bindel en vez de bind: la "e" es "repeat", o sea que dejar la tecla pulsada
# sigue subiendo en vez de moverse un paso por pulsación. La "l" es "locked":
# funcionan también con la pantalla bloqueada, que es lo que se espera del
# volumen y del brillo.
# Los argumentos son los que m-volume entiende de verdad: 5 y -5, no "up" y
# "down". Comprobado leyendo la herramienta en vez de suponerlo.
bindel = , XF86AudioRaiseVolume,  exec, /usr/bin/m-volume 5
bindel = , XF86AudioLowerVolume,  exec, /usr/bin/m-volume -5
bindl  = , XF86AudioMute,         exec, /usr/bin/m-volume mute
bindel = , XF86MonBrightnessUp,   exec, /usr/bin/m-brillo subir
bindel = , XF86MonBrightnessDown, exec, /usr/bin/m-brillo bajar

# La tecla de bloqueo, en los teclados que la traen.
bindl  = , XF86ScreenSaver, exec, /usr/bin/m-bloquear

# Captura de pantalla con la tecla de siempre.
bind = , Print, exec, /usr/bin/m-screenshot

# Bloquear la sesión. SUPER+L es el atajo que ya tiene todo el mundo en los
# dedos, venga de donde venga. El ALT+L de repuesto existe por lo mismo que el
# resto de duplicados de este archivo: en una máquina virtual el anfitrión se
# queda con SUPER y el atajo nunca llega.
bind = $mainMod, L, exec, /usr/bin/m-bloquear
bind = $altMod, L, exec, /usr/bin/m-bloquear

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $altMod, left, movefocus, l
bind = $altMod, right, movefocus, r
bind = $altMod, up, movefocus, u
bind = $altMod, down, movefocus, d


# Navegación circular entre los cuatro workspaces del rice.
bind = $mainMod, mouse_down, exec, /usr/bin/m-workspace-cycle next
bind = $mainMod, mouse_up, exec, /usr/bin/m-workspace-cycle prev


# Mouse Move/Resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $altMod, mouse:272, movewindow
bindm = $altMod, mouse:273, resizewindow

# MIKE OS rice: workspaces persistentes y accesos rápidos propios.
bind = $mainMod, D, exec, /usr/bin/m-launcher
bind = $mainMod, N, exec, /usr/bin/m-network status
bind = $mainMod, I, exec, /usr/bin/m-system
# El selector de fondos vive dentro de la shell, no en una ventana GTK
# aparte. Hyprland no puede llamar a un objeto QML, así que se lo pide por
# la interfaz de mensajes de Quickshell.
bind = $mainMod, W, exec, /usr/bin/quickshell ipc call fondos abrir
bind = $mainMod, F1, exec, /usr/bin/m-doctor
bind = $mainMod, F2, exec, /usr/bin/m-service list
bind = $mainMod, F12, exit,

# El compositor usa sus reglas modernas por defecto; evitar la sintaxis
# windowrulev2 retirada en Hyprland 0.56.
