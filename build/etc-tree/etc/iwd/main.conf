# Configuración de iwd, el que lleva el wifi.
#
# EnableNetworkConfiguration es lo que faltaba, y sin ello el wifi "funcionaba"
# de la peor manera: se asociaba a la red, decía que estaba conectado... y no
# tenía dirección IP, porque nadie se la pedía. El servicio de red de MIKE OS
# no toca las interfaces inalámbricas a propósito (dos clientes DHCP sobre la
# misma tarjeta se pelean por la misma concesión), así que tiene que hacerlo
# iwd.
[General]
EnableNetworkConfiguration=true

[Network]
# Que escriba los servidores de nombres al conectarse.
NameResolvingService=resolvconf

[Scan]
# Buscar redes también con la pantalla apagada: si no, al volver de suspender
# el equipo se queda sin red hasta que alguien abre la lista a mano.
DisablePeriodicScan=false
