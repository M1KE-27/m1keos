# Configuración de bluetoothd.
#
# Antes no existía este archivo y bluetoothd arrancaba con sus valores
# compilados. Funciona, pero deja dos cosas al azar que aquí no pueden estar al
# azar: que el adaptador se encienda solo al aparecer, y que un mando o unos
# cascos se vuelvan a conectar sin tener que emparejarlos otra vez.

[General]
# El nombre que ven los demás aparatos.
Name = MIKE OS
# Ordenador portátil. Cambia el icono que se ve desde el móvil.
Class = 0x00010c
# Reconectar a lo ya emparejado en cuanto vuelve a estar cerca, sin pedir nada.
# Es lo que hace que unos cascos se conecten al encenderlos.
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
# Emparejar de nuevo un aparato que perdió sus claves (le pasa a muchos mandos
# y cascos baratos) en vez de fallar con un error que no dice nada.
JustWorksRepairing = always
# Sin límite de tiempo para completar un emparejamiento a mano: 60 segundos no
# llegan si hay que buscar el botón del aparato.
PairableTimeout = 0
DiscoverableTimeout = 180

[Policy]
# Encender el adaptador en cuanto aparece. Sin esto, en algunos equipos el
# Bluetooth queda apagado tras arrancar y hay que encenderlo a mano cada vez,
# que es exactamente lo que parecía "el Bluetooth no funciona".
AutoEnable = true
# Reconectar los perfiles de audio y de mando al volver a conectar.
ReconnectUUIDs = 00001112-0000-1000-8000-00805f9b34fb,0000111f-0000-1000-8000-00805f9b34fb,0000110a-0000-1000-8000-00805f9b34fb
