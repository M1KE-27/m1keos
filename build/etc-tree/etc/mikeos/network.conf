# Red de MIKE OS.
#
# Por defecto no hay que tocar nada: el servicio descubre todas las interfaces
# de cable, levanta las que tengan enlace y pide dirección por DHCP a cada una.
# Vuelve a mirar cada pocos segundos, así que un adaptador USB enchufado
# después también se configura solo.
#
# INTERFACE: "auto" (todas) o el nombre de una concreta. El wifi NO se toca
#            desde aquí: lo lleva iwd, que hace su propia configuración.
INTERFACE="auto"

# MODE: "dhcp" o "static". Con "static" se usan las tres claves de abajo.
MODE="dhcp"

STATIC_IP="192.168.1.100/24"
GATEWAY="192.168.1.1"
DNS="1.1.1.1 8.8.8.8"
